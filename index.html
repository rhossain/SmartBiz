<!DOCTYPE html>
<!--
  SmartBiz BD — root HTML.
  Vite's entry; the `src/index.tsx` module hydrates the Shell.
  Bangla-first: declares `lang="bn"` so the browser picks the
  Bengali font fallback chain before JS runs.
-->
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="x-content-type-options" content="nosniff" />
    <title>SmartBiz BD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
