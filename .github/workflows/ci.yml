name: ci

# CI pipeline for SmartBiz BD (U1-foundation, B1).
# Per aidlc/spaces/default/intents/261004-mvp/construction/U1-foundation/
#     infrastructure-design/cicd-pipeline.md
#
# 12 build stages + 20 test stages + the R1.1–R1.3 and R2.1–R2.5 gates,
# plus the real-Postgres job (B2).
# The pipeline runs on every PR and on every push to main.
# Coverage floor: 80% line coverage (NFR6.1, team.md#Testing Posture §TP-2).
# All gates block merge per team.md#Deployment §Dep-6.
#
# U1 (app-wiring, u1-skeleton): this file stays the single list of gates, but hosted Actions
# stay disabled (zero spend). The merge evidence is `bun run gate` (scripts/gate.ts), which
# runs these same gates on this machine in cicd-pipeline.md's order. Steps added in U1: the
# every-file coverage floor, the server-code bundle scan, the scripted mutants, the secret
# scan, the admin-URL migrate, the wiring check and the API benchmark.

on:
  push:
    branches: [main, app-wiring, catalog]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "1.4.3"

jobs:
  # -----------------------------------------------------------------------
  # JOB 1 — build stages (10 of them, per cicd-pipeline.md "Build stages")
  # -----------------------------------------------------------------------
  build:
    name: build (12 stages)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: bun install
        run: bun install --frozen-lockfile

      # Build stage 1 — Lint
      - name: "1. lint (eslint)"
        run: bun run lint

      # Build stage 2 — Type-check
      - name: "2. type-check (tsc --noEmit)"
        run: bun run type-check

      # Build stage 3 — Format check
      - name: "3. format check (prettier --check)"
        run: bun run format

      # Build stage 4 — Unit test
      - name: "4. unit test (bun test)"
        run: bun run test

      # Build stage 4b — U2 gate step 5b: the three role walks on their own, timed. A test
      # failure fails at once; only a wall time over 60 s is run once more (NFR6.16, I-05).
      - name: "4b. role walks (server, client, no-secret; <= 60 s, one rerun on overrun)"
        run: |
          set -e
          walks="tests/integration/server-gate-absence.test.ts tests/unit/three-layer-gate-absence.test.ts tests/integration/no-secret-responses.test.ts"
          start=$(date +%s)
          bun test --timeout 60000 $walks
          took=$(( $(date +%s) - start ))
          echo "walks took ${took} s"
          if [ "$took" -gt 60 ]; then
            start=$(date +%s)
            bun test --timeout 60000 $walks
            again=$(( $(date +%s) - start ))
            echo "walks rerun took ${again} s"
            if [ "$again" -gt 60 ]; then echo "::error::walks took ${took} s then ${again} s (budget 60 s)"; exit 1; fi
          fi

      # Build stage 5 — Coverage
      - name: "5. coverage (>= 80% line coverage)"
        run: bun run coverage

      # Build stage 5b — Coverage floor (B2). Stage 5 prints the report but
      # nothing enforced the 80% floor (.c8rc.json check-coverage is false
      # and bunfig.toml sets no threshold). This step fails the build when
      # line coverage over all reported source files is below 80%
      # (NFR6.1, team.md §TP-2). The floor is never lowered here.
      # U1: scripts/check-coverage.ts also fails when any src file is missing from the
      # report (tests/import-all.test.ts imports them all) and is not type-only.
      - name: "5b. coverage floor (>= 80% lines over every src file)"
        run: bun run check:coverage

      # Build stage 6 — R1.1 audit-immutability migration test
      - name: "6. R1.1 audit-immutability (NFR5.1, NFR1.2)"
        run: bun test tests/unit/audit-immutability-migration.test.ts

      # Build stage 7 — R1.2 three-layer-gate absence test + Owner inverse
      - name: "7. R1.2 three-layer-gate absence (NFR5.6, NFR6)"
        run: bun test tests/unit/three-layer-gate-absence.test.ts

      # Build stage 8 — Vite build
      - name: "8. vite build (NFR7.7)"
        run: bun run build

      # Build stage 9 — Bundle-size assertion (NFR2.b: <= 350 KB gzip)
      - name: "9. bundle (<= 350 KB gzip, no server code in the bundle)"
        run: bun run check:bundle

      # Build stage 10 — scripted, named mutants (team.md Testing Posture). Replaces the
      # old file-presence check: each entry of tests/mutants.json is applied in a throwaway
      # git worktree and its mapped test must fail; a control run proves the tests pass
      # unmutated first.
      - name: "10. mutants (every named mutant caught)"
        run: bun run mutants

      # Build stage 11 — Dependency audit (B2 CI Pipeline, Q4 = blocking).
      # Fails on any High or Critical advisory. Build and Test T-DEPS: zod
      # is a runtime dependency on the paste-parse validation path, so an
      # advisory there is a shipped-code risk, not a dev-tool note. Never
      # add --ignore here to make the step pass; fix the dependency.
      - name: "11. dependency audit (no High/Critical advisories)"
        run: bun audit --audit-level=high

      # Build stage 11a — U2 (S17, NFR10.2): package.json equals tests/spec/dependencies.json.
      - name: "11a. dependency list (no unreviewed dependency)"
        run: bun scripts/check-dependencies.ts

      # Build stage 11b — secret scan (U1; team.md Code Style). Allowed entries live in
      # secret-scan.allow, each with its reason.
      - name: "11b. secret scan (no unallowed key, token or password)"
        run: bun run check:secrets

      # Build stage 12 — Keep the built app for 30 days (B2 CI Pipeline,
      # Q5). No registry is chosen yet (team.md §Dep-3, §Dep-5); the commit
      # SHA in the name ties every download to its source.
      - name: "12. upload dist/ (smartbiz-dist-<sha>, 30 days)"
        uses: actions/upload-artifact@v4
        with:
          name: smartbiz-dist-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # JOB 2 — test stages (11 of them, per cicd-pipeline.md "Test stages")
  # -----------------------------------------------------------------------
  test:
    name: test (11 stages)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: bun install
        run: bun install --frozen-lockfile

      # Test stage 1 — Unit (per-module)
      - name: "1. unit (per-module)"
        run: bun test tests/unit

      # Test stage 2 — 3G page render (Playwright nightly) — skipped in PR
      # This is a scheduled nightly job per cicd-pipeline.md; the PR run
      # exercises the local geometry/lay-down tests instead.
      - name: "2. 3G page render (NFR2.1; nightly only — skipped on PR)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "3G Playwright run is scheduled nightly (NFR2.1)"
        continue-on-error: true

      # Test stage 3 — L(bn, en) micro-benchmark (NFR2.3: <= 5 ms p95)
      - name: "3. L(bn,en) micro-bench (NFR2.3 <= 5 ms p95)"
        run: bun test tests/unit/i18n-bench.test.ts

      # Test stage 4 — Three-layer-gate dispatch micro-bench (NFR2.c: <= 2 ms p95)
      - name: "4. gate dispatch micro-bench (NFR2.c <= 2 ms p95)"
        run: bun test tests/unit/gate-bench.test.ts

      # Test stage 5 — Typed state container micro-bench (NFR2.d: <= 1 ms p95)
      - name: "5. state container micro-bench (NFR2.d <= 1 ms p95)"
        run: bun test tests/unit/state-bench.test.ts

      # Test stage 6 — Bundle-size assertion
      - name: "6. bundle-size assertion (NFR2.b <= 350 KB)"
        run: |
          set -e
          bun run build
          gzip_bytes=$(gzip -c dist/assets/*.js 2>/dev/null | wc -c | tr -d ' ')
          max_bytes=$((350 * 1024))
          if [ "$gzip_bytes" -gt "$max_bytes" ]; then
            echo "::error::Bundle size $gzip_bytes bytes exceeds 350 KB limit"
            exit 1
          fi

      # Test stage 7 — Audit-immutability migration (R1.1)
      - name: "7. R1.1 audit-immutability migration"
        run: bun test tests/unit/audit-immutability-migration.test.ts

      # Test stage 8 — Three-layer-gate absence (R1.2)
      - name: "8. R1.2 three-layer-gate absence"
        run: bun test tests/unit/three-layer-gate-absence.test.ts

      # Test stage 9 — Design-token contrast assertion (NFR4 WCAG AA)
      - name: "9. design-token contrast (NFR4 WCAG AA)"
        run: bun test tests/unit/contrast.test.ts

      # Test stage 10 — Role-lock keyboard-reach test (NFR4)
      - name: "10. role-lock keyboard reach (NFR4)"
        run: bun test tests/unit/role-lock-reach.test.tsx

      # Test stage 11 — E2E flows (smoke)
      # In B1 the E2E is the integration suite (no Playwright yet — that
      # lands with the U5 surface in B5). The integration tests cover
      # the audit-append flow, reversal flow, single-tenant boundary,
      # and email-gateway-failure graceful degradation.
      - name: "11. e2e smoke (integration suite — UC-1.9, UC-1.10, BR1.4, BR3.4)"
        run: bun test tests/integration

      # -------------------------------------------------------------------
      # B2 (U3-orders) gates. Each blocks merge (team.md §Dep-6). The
      # benchmarks read CI=true (set by GitHub Actions) and fail at 10×
      # their local budget, per the B2 cicd-pipeline design.
      # -------------------------------------------------------------------
      - name: "12. R2.1 order audit append per action (NFR5.7, FR12.3)"
        run: bun test tests/unit/order-audit-append.test.ts

      - name: "13. R2.2 paste-parse segment isolation (FR5.2, NFR6.5, NFR6.7.2-3)"
        run: bun test tests/unit/parseMessage-segments.test.ts tests/unit/parseMessage-bad-input.test.ts

      - name: "14. R2.3 status-bucket math (FR10.2)"
        run: bun test tests/unit/status-bucket.test.ts

      - name: "15. R2.4 status enum exhaustive (FR5.3)"
        run: bun test tests/unit/status-exhaustive.test.ts tests/unit/status-fsm.test.ts

      - name: "16. R2.5 deferred input logging (NFR3.3)"
        run: bun test tests/unit/deferred-input-logging.test.ts

      - name: "17. parseMessage micro-bench (NFR6.7.1 <= 20 ms p95; CI fails > 200 ms)"
        run: bun test tests/unit/parseMessage-bench.test.ts

      - name: "18. status-bucket micro-bench (NFR2.5 <= 1 ms p95; CI fails > 10 ms)"
        run: bun test tests/unit/status-bucket-bench.test.ts

      - name: "19. orders-list bench (NFR6.10 <= 1 s p95 for 1 000 orders; CI fails > 10 s)"
        run: bun test tests/unit/orders-list-bench.test.ts

      - name: "20. PCI deny-list over src/orders/ (NFR5.4)"
        run: bun test tests/unit/pci-deny-list-orders.test.ts

  # -----------------------------------------------------------------------
  # JOB 4 — real Postgres (B2 CI Pipeline, Q4 = blocking)
  # -----------------------------------------------------------------------
  # The unit and integration suites run on an in-memory SQL stub that
  # cannot see FOR UPDATE, ANY($1::uuid[]), keyset cursors, real role
  # grants or JSONB parameter typing. Build and Test found a defect only a
  # real database shows (T-JSONB), so every PR runs the migrations and the
  # order/audit paths against a throwaway postgres:18 service container.
  # The password below is a CI-only throwaway for a container that lives
  # for this job; it guards nothing and is not a secret.
  realdb:
    name: real Postgres (migrations, grants, order paths)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_throwaway
          POSTGRES_DB: smartbiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartbiz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # U1: migrations run with the admin URL in MIGRATE_DATABASE_URL (BR1.3).
      MIGRATE_DATABASE_URL: postgres://postgres:ci_throwaway@localhost:5432/smartbiz
      REALDB_ADMIN_URL: postgres://postgres:ci_throwaway@localhost:5432/smartbiz
      REALDB_APP_URL: postgres://ci_app:ci_throwaway@localhost:5432/smartbiz
      PGPASSWORD: ci_throwaway
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: bun install
        run: bun install --frozen-lockfile

      - name: "1. migrate (T-MIGRATE, FR5.1)"
        run: bun run migrate

      - name: "2. migrate again — every file must be skipped (idempotent)"
        run: |
          set -o pipefail
          bun run migrate | tee migrate2.txt
          applied=$(grep -c '^apply ' migrate2.txt || true)
          if [ "$applied" -ne 0 ]; then echo "::error::second migrate applied $applied file(s)"; exit 1; fi

      - name: "3. app_role grants (TC9, team.md §Dep-6)"
        run: |
          set -e
          q="SELECT privilege_type FROM information_schema.role_table_grants WHERE grantee = 'app_role' AND table_name = 'audit_log' ORDER BY 1"
          got=$(psql -h localhost -U postgres -d smartbiz -At -c "$q" | paste -sd, -)
          echo "audit_log grants for app_role: $got"
          if [ "$got" != "INSERT,SELECT" ]; then echo "::error::app_role on audit_log must be INSERT,SELECT only, got $got"; exit 1; fi
          for t in orders audit_log consignment_link; do
            del=$(psql -h localhost -U postgres -d smartbiz -At -c "SELECT count(*) FROM information_schema.role_table_grants WHERE grantee = 'app_role' AND table_name = '$t' AND privilege_type = 'DELETE'")
            if [ "$del" -ne 0 ]; then echo "::error::app_role holds DELETE on $t"; exit 1; fi
          done

      - name: "4. app login role for the suite"
        run: psql -h localhost -U postgres -d smartbiz -c "CREATE ROLE ci_app LOGIN PASSWORD 'ci_throwaway' IN ROLE app_role;"

      - name: "5. order + audit paths, R1.1, T-JSONB on real Postgres"
        run: |
          test -n "$REALDB_ADMIN_URL" && test -n "$REALDB_APP_URL"
          bun test tests/realdb

      # U1 — W10 wiring check on its own fresh, empty database (from businessExists: false).
      - name: "6. wiring check (W10, BR10.1-BR10.3)"
        run: bun run test:e2e

      # U2 gate step 14b — the real-browser check (first load <= 2 s, no sideways scroll at
      # 360 px). Exit 2 means no Chrome at CHROME_PATH and is reported "not run", never a pass;
      # any other non-zero exit fails (I-01).
      - name: "6a. build for the browser check"
        run: bun run build

      - name: "6b. real-browser check (NFR6.14, NFR9.6)"
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set +e
          bun scripts/browser-check.ts
          code=$?
          if [ "$code" -eq 2 ]; then echo "browser: not run (no Chrome)"; exit 0; fi
          exit $code

      # U1 — API latency (NFR6.1-NFR6.3); budgets are constants and never relaxed by CI.
      - name: "7. API benchmark (p95 <= 300 ms per route, session <= 20 ms, sign-in <= 1.5 s)"
        run: bun run bench

  # -----------------------------------------------------------------------
  # JOB 3 — R1.3 round-trip (no-float drift) — NFR2.x + ADR-002 binding test
  # -----------------------------------------------------------------------
  round-trip:
    name: R1.3 money-engine round-trip (no float drift)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: bun install
        run: bun install --frozen-lockfile

      - name: "R1.3 money-engine paise-integer round-trip (1000-iteration)"
        run: bun test tests/unit/money-engine-round-trip.test.ts
